[package]
name = "field-edge-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "FieldEdge core: Qdrant (via Rust bridge) + sync orchestrator for offline-first mobile AI"
license = "MIT"

[lib]
# Android: cdylib for JNI .so
# iOS (future): staticlib for direct linking
# Tests: rlib
crate-type = ["cdylib", "staticlib", "rlib"]
name = "field_edge_rust"

[features]
default = []
no-network = []

[dependencies]
# Primary: qdrant-client in local mode (path-based in-process vector DB).
# This is the active adapter — the working EdgeOps implementation.
qdrant-client = { version = "1.12", default-features = false, features = ["reqwest"] }

# qdrant-edge (the official Rust crate) is NOT a runtime dep — it's
# documented as our future swap target. Pulling it into the build graph
# triggered its build.rs panic on armv7 ("CARGO_CFG_TARGET_FEATURE not
# defined"), which broke our Android cross-compile. Removed for v1.

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Async runtime (light usage)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Encryption: AES-256-GCM + HKDF-SHA256 for keystore-derived WAL / shard keys
aes-gcm = "0.10"
hkdf = "0.12"
getrandom = "0.2"

# JNI bindings (Android)
jni = "0.22"

# UniFFI (for Swift/Kotlin binding generation)
uniffi = "0.28"
uniffi_macros = "0.28"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rand = "0.8"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "diff_benchmark"
harness = false

[[bench]]
name = "encryption_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
