apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Autolinking for native modules (generates PackageList.kt)
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fieldedge"
    defaultConfig {
        applicationId "com.fieldedge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // ABIs we ship native .so files for
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    packagingOptions {
        jniLibs {
            // Don't strip — we need UniFFI metadata in the .so
            keepDebugSymbols += "**/libfield_edge_rust.so"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native — autolinked
    implementation("com.facebook.react:react-android")

    // Hermes (optional but recommended for RN >= 0.74)
    // implementation("com.facebook.react:hermes-android")

    // ONNX Runtime Android — for CLIP inference
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.18.0")

    // Kotlin coroutines (used by Kotlin native module)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
