pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

rootProject.name = 'FieldEdge'

// Autolinking for React Native libraries
apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

// Include the React Native gradle plugin (provides com.facebook.react + com.facebook.react.rootproject)
includeBuild('../node_modules/@react-native/gradle-plugin')

include ':app'
